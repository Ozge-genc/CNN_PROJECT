<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çiçek Türü Tespiti</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container {% if prediction %}result-active{% endif %}">
    <h1>🌸 Çiçek Türü Tespit</h1>
    <p class="subtitle">Yapay zeka ile çiçeğinizin türünü saniyeler içinde öğrenin.</p>

    <form method="POST" enctype="multipart/form-data">
        <div class="upload-box" id="drop-area">
            <input type="file" name="file" id="fileInput" required onchange="updateFileName()">
            <label for="fileInput">
                <i class="fas fa-cloud-upload-alt" style="font-size: 40px; color: #6a5acd; margin-bottom: 10px;"></i><br>
                <span id="file-label">Dosyayı buraya sürükleyin veya tıklayın</span>
                <p id="file-name" class="file-name-display"></p>
            </label>
        </div>

        <button type="submit" class="btn">
            <i class="fas fa-search"></i> Analiz Et
        </button>
    </form>

    {% if prediction %}
    <div class="result-container">
        <div class="result-card">
            <div class="result-image">
                <img src="{{ image_path }}" alt="Yüklenen Görsel">
            </div>
            <div class="result-info">
                <h3><i class="fas fa-poll-h"></i> Analiz Sonucu</h3>
                <div class="prediction-badge">{{ prediction }}</div>
                <p>Modelimiz bu görselin %98 doğrulukla bir <strong>{{ prediction }}</strong> olduğunu tahmin ediyor.</p>
                <a href="/" class="btn-outline">Yeni Sorgu</a>
            </div>
        </div>
    </div>
    {% endif %}
</div>

<script>
    // Dosya adı 
    function updateFileName() {
        const input = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('file-name');
        const labelText = document.getElementById('file-label');
        
        if (input.files.length > 0) {
            fileNameDisplay.innerText = "Seçilen Dosya: " + input.files[0].name;
            fileNameDisplay.style.display = "block";
            labelText.style.opacity = "0.5";
        }
    }
</script>

</body>
</html>
